name: Release UPM Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          PACKAGE_JSON="Packages/com.masachuang.solidtext3d/package.json"
          VERSION=$(jq -r '.version' "$PACKAGE_JSON")

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "package.json version is missing" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${VERSION}"
          fi

          if [[ "$TAG_NAME" != "v${VERSION}" ]]; then
            echo "Tag $TAG_NAME does not match package version v${VERSION}" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create package archive
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          STAGE_DIR="dist/com.masachuang.solidtext3d"
          ARCHIVE_PATH="dist/com.masachuang.solidtext3d-${VERSION}.zip"

          mkdir -p "$STAGE_DIR"
          rsync -a \
            --exclude '.meta' \
            --exclude 'Tests/' \
            Packages/com.masachuang.solidtext3d/ "$STAGE_DIR/"

          cd dist
          zip -r "com.masachuang.solidtext3d-${VERSION}.zip" "com.masachuang.solidtext3d"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          generate_release_notes: true
          files: dist/com.masachuang.solidtext3d-${{ steps.package.outputs.version }}.zip
